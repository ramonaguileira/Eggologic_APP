# Infraestructura en Render (Blueprint). Pasos para crearla en docs/etapa-3.md, "Hosting en Render".
#
# Planes pagos desde octubre/noviembre de 2026 (antes eran gratis): web de 0,5 CPU y 512 MB, base
# de 256 MB con 1 GB de disco. Lo que hay que tener presente:
# - la web no tiene disco: por eso las fotos de los retiros se guardan en la base (captura/almacen.py);
# - no hay cron: los reportes se mandan con el botón "Enviar al registro" de la pantalla Reportes.
# SUPUESTO: "starter" y "basic-256mb" son los nombres de esos planes en el Blueprint. Los planes se
# cambiaron a mano en el panel; conviene confirmar los nombres antes de sincronizar este archivo.
#
# Las credenciales de Guardian no van acá (el repo es público): se cargan en el panel, en el
# grupo de variables eggologic-guardian. Región Virginia: la más cercana a Uruguay en Render.

databases:
  - name: eggologic-db
    databaseName: eggologic
    user: eggologic
    plan: basic-256mb
    region: virginia

envVarGroups:
  - name: eggologic-guardian
    envVars:
      - key: GUARDIAN_URL
        value: https://guardianservice.app/api/v1
      # En el panel se suman DJANGO_EMAIL_SMTP_PASSWORD, GUARDIAN_POLICY_ID, GUARDIAN_PROPONENTE_EMAIL,
      # GUARDIAN_PROPONENTE_PASSWORD y un par GUARDIAN_R00X_EMAIL / _PASSWORD por restaurante.

services:
  - type: web
    name: eggologic
    runtime: python
    plan: starter
    region: virginia
    buildCommand: ./build.sh
    startCommand: gunicorn eggologic.wsgi:application
    healthCheckPath: /ingresar/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: TIENDA_DATOS_TRANSFERENCIA
        sync: false
      # Primer usuario de administración: build.sh lo crea si no existe.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DB_NAME
        fromDatabase: { name: eggologic-db, property: database }
      - key: DB_USER
        fromDatabase: { name: eggologic-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: eggologic-db, property: password }
      - key: DB_HOST
        fromDatabase: { name: eggologic-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: eggologic-db, property: port }
      - fromGroup: eggologic-guardian
